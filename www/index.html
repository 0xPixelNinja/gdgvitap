<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GDG on Campus VIT-AP</title>
    <meta name="description" content="GDG on Campus VIT-AP is under maintenance." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/site.css?v=3" />
    <style>
      :root {
        --blue: #4285f4;
        --red: #ea4335;
        --yellow: #fbbc04;
        --green: #34a853;
        --ink: #202124;
        --muted: #5f6368;
        --paper: #f8f9fa;
        --line: #e8eaed;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: "Google Sans", Roboto, system-ui, sans-serif;
        color: var(--ink);
        background: #fff;
      }
      .stage { flex: 1; display: grid; place-items: center; padding: 48px 20px 32px; }
      .sheet { width: min(560px, 100%); text-align: center; }
      .mobile { height: 92px; display: flex; justify-content: center; align-items: flex-start; gap: 18px; }
      .string { width: 1px; height: 36px; background: #dadce0; margin: 0 auto; }
      .fold { width: 54px; height: 46px; border-radius: 2px 14px 4px 14px; position: relative; }
      .fold.b { background: var(--blue); transform: rotate(-8deg); }
      .fold.r { background: var(--red); transform: rotate(7deg); }
      .fold.y { background: var(--yellow); transform: rotate(-3deg); }
      .fold.g { background: var(--green); transform: rotate(10deg); }
      .tape { display: inline-block; width: 72px; height: 18px; margin-bottom: -8px; background: rgba(251, 188, 4, 0.55); transform: rotate(-2deg); }
      h1 { margin: 10px 0 8px; font-size: clamp(36px, 7vw, 56px); letter-spacing: -0.03em; line-height: 1.05; }
      p { margin: 0 auto; max-width: 38ch; color: var(--muted); font-size: 17px; line-height: 1.6; }
      .dots { display: flex; justify-content: center; gap: 8px; margin-top: 28px; }
      .dots i { width: 10px; height: 10px; border-radius: 99px; display: block; }
      .dots i:nth-child(1) { background: var(--blue); }
      .dots i:nth-child(2) { background: var(--red); }
      .dots i:nth-child(3) { background: var(--yellow); }
      .dots i:nth-child(4) { background: var(--green); }
      .plane { width: 72px; height: 72px; margin: 28px auto 0; background: var(--blue); clip-path: polygon(8% 42%, 92% 8%, 58% 92%, 46% 58%, 18% 70%); }
      footer { border-top: 1px solid var(--line); padding: 22px 20px 28px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; max-width: 880px; width: calc(100% - 32px); margin: 0 auto; color: var(--muted); font-size: 13px; }
      .social { display: flex; gap: 8px; }
      .social a { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 99px; display: grid; place-items: center; color: var(--muted); text-decoration: none; }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <main class="stage" id="main">
      <div class="sheet">
        <div class="mobile" aria-hidden="true">
          <div><div class="string"></div><div class="fold b"></div></div>
          <div><div class="string"></div><div class="fold r"></div></div>
          <div><div class="string"></div><div class="fold y"></div></div>
          <div><div class="string"></div><div class="fold g"></div></div>
        </div>
        <div class="tape" aria-hidden="true"></div>
        <h1>Under maintenance</h1>
        <p>We are tidying the campus site.</p>
        <div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div class="plane" aria-hidden="true"></div>
      </div>
    </main>
    <footer>
